name: Build Pilotagem Virtual Trainer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "trainer_main.py"
      - "src/**"
      - "resources/**"
      - "tests/**"
      - ".github/workflows/build-trainer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,build]"

      - name: Run tests
        run: python -m pytest

      - name: Build Windows executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name PilotagemVirtual
          --paths src
          --add-data "resources;resources"
          trainer_main.py

      - name: Create distributable archive
        shell: pwsh
        run: >-
          Compress-Archive
          -Path dist/PilotagemVirtual/*
          -DestinationPath PilotagemVirtual-windows-x64.zip

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: PilotagemVirtual-windows-x64
          path: PilotagemVirtual-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

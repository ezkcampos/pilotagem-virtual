[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotagem-virtual"
version = "0.2.1.dev0"
description = "Treinador modular de técnicas de pilotagem virtual"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.11.2",
  "pygame==2.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10"]
build = ["pyinstaller==6.22.2"]

[project.scripts]
pilotagem-virtual = "pilotagem_virtual.trainer_app:main"
pilotagem-virtual-g29-spike = "pilotagem_virtual.hardware_spike:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
